<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Oevra Liquid Cursor - Mobile Optimized</title>
    <style>
        body, html { margin: 0; background: #1a2a15; overflow: hidden; height: 100vh; cursor: default; touch-action: none; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform vec2 u_mouse;
        uniform vec2 u_res;
        uniform float u_time;
        uniform float u_velocity;
        uniform float u_dpr;

        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

        float snoise(vec2 v) {
            const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
            vec2 i  = floor(v + dot(v, C.yy) );
            vec2 x0 = v -   i + dot(i, C.xx);
            vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
            vec4 x12 = x0.xyxy + C.xxzz;
            x12.xy -= i1;
            i = mod289(i);
            vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
            vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
            m = m*m ; m = m*m ;
            vec3 x = 2.0 * fract(p * C.www) - 1.0;
            vec3 h = abs(x) - 0.5;
            vec3 ox = floor(x + 0.5);
            vec3 a0 = x - ox;
            m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
            vec3 g;
            g.x  = a0.x  * x0.x  + h.x  * x0.y;
            g.yz = a0.yz * x12.xz + h.yz * x12.yw;
            return 130.0 * dot(m, g);
        }

        void main() {
            vec2 pixelPos = gl_FragCoord.xy;
            vec2 diff = pixelPos - u_mouse;

            // Rotation Clockwise
            float angle = -u_time * 0.5;
            mat2 rot = mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
            vec2 rotatedDiff = rot * diff;

            // --- TAILLE ADAPTATIVE ---
            // On multiplie la taille de base par le DPR pour que ça reste grand sur mobile
            float baseRadius = 180.0 * u_dpr; 
            vec2 ovalScale = vec2(0.6, 1.2);
            
            // Bruit vaporeux multi-échelle
            float nScale = 0.003 / u_dpr;
            float noise = snoise(pixelPos * nScale - u_time * 0.2) * (40.0 * u_dpr);
            float noise2 = snoise(pixelPos * (nScale * 2.0) + u_time * 0.1) * (15.0 * u_dpr);
            
            float d = length(rotatedDiff * ovalScale) + noise + noise2;
            
            // Calcul du Glow (très doux/vaporeux)
            float radius = baseRadius + (u_velocity * 100.0);
            float outer = smoothstep(radius * 1.3, radius * 0.4, d);
            float inner = smoothstep(0.0, radius * 0.5, d);
            float glow = outer * inner;

            // Grain de film
            float grain = fract(sin(dot(pixelPos, vec2(12.9898,78.233))) * 43758.5453) * 0.12;

            gl_FragColor = vec4(vec3(1.0), (glow * 0.35) + grain);
        }
    </script>

    <script>
        const container = document.getElementById('canvas-container');
        let mouse = { x: -2000, y: -2000 }, smoothMouse = { x: -2000, y: -2000 }, lastMouse = { x: 0, y: 0 }, velocity = 0;
        
        const dpr = window.devicePixelRatio || 1;
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setPixelRatio(dpr);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const uniforms = {
            u_mouse: { value: new THREE.Vector2(0, 0) },
            u_res: { value: new THREE.Vector2(window.innerWidth * dpr, window.innerHeight * dpr) },
            u_time: { value: 0 },
            u_velocity: { value: 0 },
            u_dpr: { value: dpr }
        };

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
            fragmentShader: document.getElementById('fragmentShader').textContent,
            transparent: true
        });

        scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

        function updateCoords(x, y) {
            mouse.x = x * dpr;
            mouse.y = (window.innerHeight - y) * dpr;
        }

        window.addEventListener('mousemove', e => updateCoords(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => {
            if(e.touches.length > 0) updateCoords(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
        window.addEventListener('touchstart', e => {
            if(e.touches.length > 0) {
                updateCoords(e.touches[0].clientX, e.touches[0].clientY);
                smoothMouse.x = mouse.x; smoothMouse.y = mouse.y;
            }
        });

        function animate(time) {
            smoothMouse.x += (mouse.x - smoothMouse.x) * 0.12;
            smoothMouse.y += (mouse.y - smoothMouse.y) * 0.12;
            
            let d = Math.sqrt(Math.pow(mouse.x - lastMouse.x, 2) + Math.pow(mouse.y - lastMouse.y, 2));
            velocity += (d - velocity) * 0.1;
            lastMouse.x = mouse.x; lastMouse.y = mouse.y;

            uniforms.u_mouse.value.set(smoothMouse.x, smoothMouse.y);
            uniforms.u_time.value = time * 0.001;
            uniforms.u_velocity.value = Math.min(velocity / (30.0 * dpr), 1.5);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
