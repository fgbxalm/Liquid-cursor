<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Oevra Liquid Cursor - Round, Vaporeux & HD Mobile</title>
    <style>
        body, html { margin: 0; background: #5d7c50; overflow: hidden; height: 100vh; cursor: default; touch-action: none; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform vec2 u_mouse;
        uniform vec2 u_res;
        uniform float u_time;
        uniform float u_velocity;

        // Fonction de bruit Simplex pour l'aspect vaporeux
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

        float snoise(vec2 v) {
            const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
            vec2 i  = floor(v + dot(v, C.yy) );
            vec2 x0 = v -   i + dot(i, C.xx);
            vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
            vec4 x12 = x0.xyxy + C.xxzz;
            x12.xy -= i1;
            i = mod289(i);
            vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
            vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
            m = m*m ; m = m*m ;
            vec3 x = 2.0 * fract(p * C.www) - 1.0;
            vec3 h = abs(x) - 0.5;
            vec3 ox = floor(x + 0.5);
            vec3 a0 = x - ox;
            m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
            vec3 g;
            g.x  = a0.x  * x0.x  + h.x  * x0.y;
            g.yz = a0.yz * x12.xz + h.yz * x12.yw;
            return 130.0 * dot(m, g);
        }

        void main() {
            vec2 pixelPos = gl_FragCoord.xy;
            vec2 pixelMouse = u_mouse;

            vec2 diff = pixelPos - pixelMouse;

            // --- 1. ROTATION PLUS DOUCE (sens horaire) ---
            float angle = -u_time * 0.6; // Ralenti pour plus de rondeur
            float cosA = cos(angle);
            float sinA = sin(angle);
            mat2 rot = mat2(cosA, -sinA, sinA, cosA);
            vec2 rotatedDiff = rot * diff;

            // --- 2. OVALISATION PLUS LARGE (Plus proche du rond) ---
            // On élargit : X passe à 0.65 (moins compressé) et Y à 1.3
            vec2 ovalScale = vec2(0.65, 1.3);
            vec2 scaledDiff = rotatedDiff * ovalScale;

            // --- 3. EFFET LIQUIDE VAPOREUX (Ajusté pour HD) ---
            // On réduit l'échelle de fréquence (0.003 au lieu de 0.005)
            // car les pixels physiques sont plus nombreux.
            float noiseFactor = snoise(pixelPos * 0.003 - u_time * 0.2) * 80.0;
            float baseD = length(scaledDiff) + noiseFactor;
            
            // --- 4. TAILLE ADAPTATIVE POUR ÉCRAN HD ---
            // On double la taille de base (radius) car les pixels sont 2x ou 3x plus petits.
            // radius passe de 80.0 à 180.0 pour un look large.
            float radius = 180.0; 
            
            // u_velocity impacte la taille de la texture liquide
            float outer = smoothstep(radius, radius * 0.5, baseD);
            float inner = smoothstep(0.0, radius * 0.4, baseD);
            float glow = outer * inner * 2.5;

            // Grain de film (Look image_2.png)
            float grain = fract(sin(dot(pixelPos, vec2(12.9898,78.233))) * 43758.5453) * 0.12;

            // Opacité subtile
            gl_FragColor = vec4(vec3(1.0), (glow * 0.3) + grain);
        }
    </script>

            u_velocity: { value: 0 }
        };

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
            fragmentShader: document.getElementById('fragmentShader').textContent,
            transparent: true
        });

        scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

            mouse.y = (window.innerHeight - y) * window.devicePixelRatio;
        }

        });
