<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oevra - Perfect Layering</title>
    <style>
        :root { 
            --bg-page: #ece8d9; /* Beige Sable Fin */
            --bg-card: #062419; 
            --apple-ease: cubic-bezier(0.4, 0, 0.1, 1);
            --duration: 0.6s;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg-page); font-family: -apple-system, sans-serif; color: white; overflow-x: hidden; }

        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3000; pointer-events: none; }

        .container { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .card-placeholder { width: 100%; height: 280px; }

        .card {
            width: 100%; height: 280px;
            border-radius: 40px; overflow: hidden;
            background: var(--bg-card); cursor: pointer;
            z-index: 10; /* Z-index de base */
            will-change: top, left, width, height, border-radius, z-index;
            transition: 
                top var(--duration) var(--apple-ease), 
                left var(--duration) var(--apple-ease), 
                width var(--duration) var(--apple-ease), 
                height var(--duration) var(--apple-ease), 
                border-radius var(--duration) var(--apple-ease);
        }

        .card img { 
            width: 100vw; height: 60vh; 
            object-fit: cover; display: block;
            position: absolute; top: 0; left: 0;
            transform: translateX(var(--img-x, 0px));
            transition: transform var(--duration) var(--apple-ease), border-radius var(--duration) var(--apple-ease);
            border-radius: 40px 40px 0 0;
        }

        .card-content {
            margin-top: 60vh; padding: 40px 30px;
            background: var(--bg-card); height: 40vh;
            opacity: 0; transition: opacity 0.3s;
        }

        /* État Ouvert */
        .card.is-open {
            z-index: 2000 !important; /* Priorité maximale quand ouvert */
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            border-radius: 0 !important;
        }
        .card.is-open img { transform: translateX(0) !important; border-radius: 0 !important; }
        .card.is-open .card-content { opacity: 1; }

        /* Classe temporaire pour la fermeture afin de rester au-dessus de l'autre carte */
        .is-closing { z-index: 100 !important; }

        .close-btn {
            position: fixed; top: 30px; right: 25px; width: 42px; height: 42px;
            border-radius: 50%; background: rgba(0,0,0,0.3); backdrop-filter: blur(15px);
            color: white; border: none; z-index: 3100; opacity: 0;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.3s; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="container">
        <div class="card-placeholder">
            <div class="card" onclick="openCard(this)">
                <img src="https://images.unsplash.com/photo-1512290923902-8a9f81dc236c?auto=format&fit=crop&w=1200&q=80">
                <div class="card-content">
                    <h1 style="margin:0; font-size: 32px; font-weight: 700;">Soin Signature</h1>
                    <p style="margin-top:20px; opacity:0.7; line-height:1.7;">Ce soin se fermera toujours par-dessus le second.</p>
                </div>
            </div>
        </div>
        <div class="card-placeholder">
            <div class="card" onclick="openCard(this)">
                <img src="https://images.unsplash.com/photo-1515377905703-c4788e51af15?auto=format&fit=crop&w=1200&q=80">
                <div class="card-content">
                    <h1 style="margin:0; font-size: 32px; font-weight: 700;">Massage Huile</h1>
                    <p style="margin-top:20px; opacity:0.7; line-height:1.7;">Gestion dynamique des couches (z-index).</p>
                </div>
            </div>
        </div>
    </div>

    <button class="close-btn" id="close" onclick="closeCard()">✕</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform vec2 u_mouse;
        uniform vec2 u_res;
        uniform float u_time;
        uniform float u_velocity;

        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

        float snoise(vec2 v) {
            const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
            vec2 i  = floor(v + dot(v, C.yy) );
            vec2 x0 = v -   i + dot(i, C.xx);
            vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
            vec4 x12 = x0.xyxy + C.xxzz;
            x12.xy -= i1;
            i = mod289(i);
            vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
            vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
            m = m*m ; m = m*m ;
            vec3 x = 2.0 * fract(p * C.www) - 1.0;
            vec3 h = abs(x) - 0.5;
            vec3 ox = floor(x + 0.5);
            vec3 a0 = x - ox;
            m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
            vec3 g;
            g.x  = a0.x  * x0.x  + h.x  * x0.y;
            g.yz = a0.yz * x12.xz + h.yz * x12.yw;
            return 130.0 * dot(m, g);
        }

        void main() {
            vec2 pixelPos = gl_FragCoord.xy;
            vec2 pixelMouse = u_mouse;
            float noise = snoise(pixelPos * 0.005 - u_time * 0.15) * 40.0;
            float d = distance(pixelPos, pixelMouse + noise);
            float radius = 90.0 + (u_velocity * 50.0);
            float outer = smoothstep(radius, radius * 0.5, d);
            float inner = smoothstep(0.0, radius * 0.4, d);
            float glow = outer * inner * 2.0;
            float grain = fract(sin(dot(pixelPos, vec2(12.9898,78.233))) * 43758.5453) * 0.08;
            gl_FragColor = vec4(vec3(1.0), (glow * 0.25) + grain);
        }
    </script>

    <script>
        /* CURSEUR / TACTILE */
        let mouse = { x: 0, y: 0 }, smoothMouse = { x: 0, y: 0 }, lastMouse = { x: 0, y: 0 }, velocity = 0;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const uniforms = { u_mouse: { value: new THREE.Vector2(0, 0) }, u_res: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }, u_time: { value: 0 }, u_velocity: { value: 0 } };
        const mat = new THREE.ShaderMaterial({ uniforms, vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`, fragmentShader: document.getElementById('fragmentShader').textContent, transparent: true });
        scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
        function updateCoords(x, y) { mouse.x = x; mouse.y = window.innerHeight - y; }
        window.addEventListener('mousemove', e => updateCoords(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => { if(e.touches.length) updateCoords(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
        window.addEventListener('touchstart', e => { if(e.touches.length) updateCoords(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
        function animateCursor(time) {
            smoothMouse.x += (mouse.x - smoothMouse.x) * 0.05; smoothMouse.y += (mouse.y - smoothMouse.y) * 0.05;
            let d = Math.sqrt(Math.pow(mouse.x - lastMouse.x, 2) + Math.pow(mouse.y - lastMouse.y, 2));
            velocity += (d - velocity) * 0.05; lastMouse.x = mouse.x; lastMouse.y = mouse.y;
            uniforms.u_mouse.value.set(smoothMouse.x, smoothMouse.y); uniforms.u_time.value = time * 0.001; uniforms.u_velocity.value = Math.min(velocity / 30.0, 1.0);
            renderer.render(scene, camera); requestAnimationFrame(animateCursor);
        }
        animateCursor();

        /* LOGIQUE SOINS PRÉ-RENDU ET ORDRE DE COUCHE */
        let selectedCard = null;
        const cardsData = new Map();

        function initCards() {
            document.querySelectorAll('.card').forEach(card => {
                const r = card.parentElement.getBoundingClientRect();
                card.style.position = 'fixed';
                card.style.top = r.top + 'px';
                card.style.left = r.left + 'px';
                card.style.width = r.width + 'px';
                card.style.height = r.height + 'px';
                card.style.setProperty('--img-x', `${-r.left}px`);
                cardsData.set(card, { top: r.top + 'px', left: r.left + 'px', width: r.width + 'px', height: r.height + 'px' });
            });
        }

        window.addEventListener('load', initCards);
        window.addEventListener('scroll', initCards);
        window.addEventListener('resize', () => { initCards(); renderer.setSize(window.innerWidth, window.innerHeight); uniforms.u_res.value.set(window.innerWidth, window.innerHeight); });

        function openCard(card) {
            if (selectedCard) return;
            selectedCard = card;
            
            // On s'assure qu'elle est au-dessus de tout le reste
            card.classList.add('is-open');
            document.getElementById('close').style.opacity = '1';
            document.getElementById('close').style.pointerEvents = 'auto';
            document.body.style.overflow = 'hidden';
        }

        function closeCard() {
            if (!selectedCard) return;
            const card = selectedCard;
            const data = cardsData.get(card);
            
            document.getElementById('close').style.opacity = '0';
            document.getElementById('close').style.pointerEvents = 'none';

            // On retire 'is-open' mais on ajoute 'is-closing' pour garder le z-index élevé pendant la fermeture
            card.classList.remove('is-open');
            card.classList.add('is-closing');
            
            card.style.top = data.top;
            card.style.left = data.left;
            card.style.width = data.width;
            card.style.height = data.height;

            setTimeout(() => {
                card.classList.remove('is-closing');
                document.body.style.overflow = '';
                selectedCard = null;
            }, 600);
        }
    </script>
</body>
</html>
